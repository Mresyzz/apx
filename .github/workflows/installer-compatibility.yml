name: Installer compatibility

on:
  pull_request:
    paths:
      - install.sh
      - scripts/install-tools.sh
      - .github/workflows/installer-compatibility.yml
  push:
    branches: [main]
    paths:
      - install.sh
      - scripts/install-tools.sh
      - .github/workflows/installer-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-compatibility:
    name: Test installer across Linux distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Add installation postcondition
        shell: bash
        run: |
          {
            printf '#!/usr/bin/env bash\n(\n'
            cat install.sh
            printf '\n)\ninstaller_status=$?\n[ "$installer_status" -eq 0 ] || exit "$installer_status"\n'
            cat <<'EOF'
          test -x "$HOME/.local/bin/apx" || { echo 'apx was not installed' >&2; exit 1; }
          "$HOME/.local/bin/apx" --version
          EOF
          } > installer-smoke.sh

      - name: Run installer compatibility gate
        uses: Mresyzz/opsscript-gate@v0.9.4
        with:
          script-path: installer-smoke.sh
          shell: auto
          network: bridge
          packages: |
            bash
            curl
            ca-certificates
            tar
          format: json
          output: reports/installer-compatibility.json

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-compatibility-report
          path: reports/installer-compatibility.json
          if-no-files-found: ignore
