name: Installer compatibility

on:
  pull_request:
    paths:
      - install.sh
      - scripts/install-tools.sh
      - .github/workflows/installer-compatibility.yml
  push:
    branches: [main]
    paths:
      - install.sh
      - scripts/install-tools.sh
      - .github/workflows/installer-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-compatibility:
    name: Test installer across Linux distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false`n            ref: fix/portable-tar-extraction

      - name: Run installer compatibility gate
        uses: Mresyzz/opsscript-gate@v0.8.0
        with:
          script-path: install.sh
          shell: auto
          network: bridge
          packages: |
            bash
            curl
            ca-certificates
            tar
          format: json
          output: reports/installer-compatibility.json

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-compatibility-report
          path: reports/installer-compatibility.json
          if-no-files-found: ignore
